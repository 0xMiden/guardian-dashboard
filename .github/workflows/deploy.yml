name: deploy

# Deploy the Worker to Cloudflare (bridge.miden.xyz) automatically after the
# `e2e` workflow succeeds on main. Gating on that workflow's success keeps the
# "only deploy validated code" rule true without re-running the suite here, and
# replaces the manual `npm run cf:deploy` from a laptop.
on:
  workflow_run:
    workflows: [e2e]
    types: [completed]
    branches: [main]

# Least privilege for the automatic `GITHUB_TOKEN`. With no `permissions:` block
# a workflow inherits the repository default, which on older orgs is still
# read/write across contents, issues, packages and deployments — scopes this job
# never uses. It needs exactly one thing from GitHub: read access to check out
# the commit the e2e run validated. Cloudflare is authenticated separately with
# `CLOUDFLARE_API_TOKEN` below, not with the GitHub token.
#
# This matters more here than in a `pull_request` workflow, because `workflow_run`
# runs against the base repository with access to secrets, and `npm ci` on line 34
# executes install scripts from the whole dependency tree with whatever token is
# in the environment.
permissions:
  contents: read

# Never run two production deploys at once; let an in-flight deploy finish
# rather than cancelling it mid-upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Only when the triggering e2e run passed. A failed/cancelled run never ships.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the exact commit the e2e run validated, not whatever is at
          # the tip of main by the time this fires.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # cf:build (next build --webpack + opennextjs-cloudflare build) then deploy.
      # account_id + the bridge.miden.xyz custom-domain route come from
      # wrangler.jsonc; only the API token is a secret.
      - run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
